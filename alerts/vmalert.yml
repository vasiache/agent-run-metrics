# vmalert rules: agent run anomalies.
# Only metrics that are actually emitted by the realtime plugins and the
# analyzers. Thresholds are starting points. Tune them on 2-3 weeks of
# your own runs.
groups:
  - name: agent-run-anomalies
    interval: 1m
    rules:
      - alert: AgentTokenBurst
        expr: sum by (instance, user) (increase({__name__=~"(opencode|claude_code)_agent_tokens_total"}[30m])) > 5000000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Agent token burst on {{ $labels.instance }} ({{ $value | humanize }} tokens in 30m)"
          description: "Token burn is far above normal for this instance. Check what the agent is working on."

      - alert: AgentDefectFeedbackSlow
        expr: max_over_time(agent_edit_to_gate_seconds[1h]) > 1800
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "Edit-to-gate feedback over 30 min ({{ $labels.instance }})"
          description: "Gate feedback arrives when the edit context is already displaced, so the agent worked blind on that edit. An argument for fail-fast checks at the step level."

      - alert: AgentRunWithoutIdentity
        expr: '{__name__=~"(opencode|claude_code)_agent_tool_calls_total",user=""} > 0'
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Tool calls without a user label on {{ $labels.instance }}"
          description: "Realtime metrics arrive without identity: set AGENT_METRICS_LABELS=user=... (OpenCode plugin) or check that the Claude Code adapter can resolve the user."

# NOTE: no rule for gate retries yet, because no component emits a retries counter.
# Add one (e.g. agent_gate_retries_total from the analyzer) before alerting on it.
